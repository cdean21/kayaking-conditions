name: BOM marine ingest

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bom-marine-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official BOM products and ingest
        env:
          BOM_INGEST_TOKEN: ${{ secrets.BOM_INGEST_TOKEN }}
        run: python3 tools/fetch_bom_and_ingest.py
