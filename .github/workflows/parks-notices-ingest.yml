name: Parks Victoria notice ingest

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parks-notices-ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore prior notice detail cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/parks-notices/details.json
          key: parks-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            parks-notices-v1-
      - name: Fetch Parks Victoria notices and ingest
        env:
          BOM_INGEST_TOKEN: ${{ secrets.BOM_INGEST_TOKEN }}
        run: python3 tools/fetch_parks_notices.py
      - name: Save validated notice detail cache
        uses: actions/cache/save@v4
        with:
          path: .cache/parks-notices/details.json
          key: parks-notices-v1-${{ github.run_id }}-${{ github.run_attempt }}
